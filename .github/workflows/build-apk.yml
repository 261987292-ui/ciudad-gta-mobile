name: Build Ciudad GTA APK

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm install

      - name: Add and sync Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Configure Android
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          pos = text.find("<application")
          if "android.permission.VIBRATE" not in text:
              text = text[:pos] + '    <uses-permission android:name="android.permission.VIBRATE" />\n\n' + text[pos:]
          if "<activity" in text:
              text = text.replace("<activity", '<activity android:screenOrientation="landscape"', 1)
          p.write_text(text)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Ciudad-GTA-3D
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest android/app/build/outputs/apk/debug/app-debug.apk#Ciudad-GTA-3D.apk --target main --title "Ciudad GTA 3D - Latest" --notes "APK debug generado automáticamente."
